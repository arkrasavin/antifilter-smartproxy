name: Update Antifilter

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert Antifilter
        run: python convert.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload rules
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
